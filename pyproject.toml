[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ezsort"
version = "0.4.0"
description = "A safe, lightweight file organizer with a CLI and a premium desktop GUI that tidies folders into categories."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    {name = "Kritagya Dubey"},
]
keywords = ["file-organizer", "cli", "gui", "desktop", "cleanup", "downloads", "organization"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: X11 Applications",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pyinstaller>=6.0",
    "pillow>=10.0",
]

[project.scripts]
ezsort = "ezsort.cli:main"
ezsort-gui = "ezsort.gui:run"

[project.urls]
Homepage = "https://github.com/kritagyadubey/EzSort"
Repository = "https://github.com/kritagyadubey/EzSort"
Issues = "https://github.com/kritagyadubey/EzSort/issues"

[tool.setuptools.packages.find]
include = ["ezsort*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["ezsort"]

[tool.coverage.report]
show_missing = true
