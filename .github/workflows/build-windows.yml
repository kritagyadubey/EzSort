name: Build Windows Executables

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Generate application icon
        run: python scripts/make_icon.py

      - name: Run tests before building
        run: pytest -q

      - name: Build CLI executable
        run: pyinstaller packaging/ezsort-cli.spec --noconfirm --clean

      - name: Build GUI executable
        run: pyinstaller packaging/ezsort-gui.spec --noconfirm --clean

      - name: Smoke-test CLI executable
        shell: pwsh
        run: |
          ./dist/ezsort-cli/ezsort.exe --version
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Stage release folders
        shell: pwsh
        run: |
          Compress-Archive -Path dist/ezsort-cli/* -DestinationPath ezsort-cli-windows.zip
          Compress-Archive -Path dist/EzSort/* -DestinationPath EzSort-gui-windows.zip

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-executables
          path: |
            ezsort-cli-windows.zip
            EzSort-gui-windows.zip
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ezsort-cli-windows.zip
            EzSort-gui-windows.zip
          generate_release_notes: true
